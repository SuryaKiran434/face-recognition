name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The suite deliberately does NOT install dlib or ultralytics.
      # No test imports `recognizer` (the only dlib consumer), and YOLO is
      # imported lazily inside DetectorImpl, so neither is reachable from
      # tests. Installing requirements.txt would compile dlib from source
      # and pull torch for no benefit.
      # opencv-python-headless replaces opencv-python: same cv2 API, no
      # libGL system dependency on the runner.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pytest

      - name: Run pytest
        run: python -m pytest -q
