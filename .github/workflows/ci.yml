name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Installed: what the tested modules actually import.
      #   numpy   -- encodings, matching, events fixtures
      #   opencv-python-headless -- replaces opencv-python: same cv2 API, no
      #              libGL system dependency on the runner
      #   pillow + pillow-heif -- `preprocessor` is the only Pillow consumer
      #              and imports pillow_heif at module scope, registering the
      #              HEIF opener; without both, tests/test_preprocessor.py
      #              would silently skip and Pillow bumps would go unverified
      #   pytest  -- runner
      # NOT installed: dlib and ultralytics. No test imports `recognizer`
      # (the only dlib consumer), and YOLO is imported lazily inside
      # DetectorImpl, so neither is reachable from tests. Installing
      # requirements.txt would compile dlib from source and pull torch for
      # no benefit.
      #   pytest-cov -- coverage reporting. Named explicitly here rather than
      #              installed via requirements-dev.txt, because that file
      #              pulls in requirements.txt (and therefore dlib).
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pillow pillow-heif pytest pytest-cov

      # `face_recognition_app` is the source package; everything else at the
      # repo root is tests, scripts and data.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=face_recognition_app --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `face_recognition_app/` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
