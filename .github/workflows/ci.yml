name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the full history to attribute code to authors and
          # to work out what counts as "new code"; a shallow clone breaks both.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # The pinned set lives in requirements-ci.txt, which documents what is
      # installed, what is deliberately left out (dlib, ultralytics), and why.
      # It is a manifest rather than a pip command line specifically so that
      # Dependabot can read it -- the previous ad-hoc `pip install ...` line was
      # invisible to it, and CI silently kept testing pillow-heif 1.5.0 after
      # requirements.txt had moved to 1.6.0.
      #
      # `--only-binary :all:` makes pip refuse source distributions, so no
      # package's setup.py executes on the runner. Verified against the
      # runner's target (cp312/manylinux): all 11 distributions in the resolved
      # tree have wheels, opencv-python-headless and pillow-heif included.
      #
      # `python -m pip install --upgrade pip` used to lead this block. The run
      # log shows it doing nothing -- setup-python already provides the current
      # pip -- and pinning it would turn it into a downgrade the day the runner
      # image moves ahead, so the line is gone instead.
      - name: Install test dependencies
        run: |
          pip install -r requirements-ci.txt --only-binary :all:

      # `face_recognition_app` is the source package; everything else at the
      # repo root is tests, scripts and data.
      - name: Run pytest
        run: |
          python -m pytest -q \
            --cov=face_recognition_app --cov-report=xml --cov-report=term

      - name: Coverage summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print("## Coverage")
          print()
          print(f"**{rate * 100:.2f}%** of statements in `face_recognition_app/` covered.")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      # Runs after pytest so coverage.xml already exists. Configuration lives in
      # sonar-project.properties at the repo root.
      #
      # Analysis is advisory, not a gate: continue-on-error keeps a SonarCloud
      # outage or a scanner hiccup from failing the required check.
      - name: SonarCloud analysis
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
